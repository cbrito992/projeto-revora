spring.application.name=revora
server.port=${PORT:8080}
spring.servlet.multipart.enabled=false

# =========================================================
# REVORA - IA EDITORIAL
# =========================================================

revora.ia.enabled=${REVORA_IA_ENABLED:false}
revora.ia.provider=${REVORA_IA_PROVIDER:gemini}

revora.ia.gemini.api-key=${GEMINI_API_KEY:}
revora.ia.gemini.model=${GEMINI_MODEL:gemini-2.5-flash}
revora.ia.gemini.timeout-seconds=${GEMINI_TIMEOUT_SECONDS:90}